<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ACP AAYA — Hill Drive</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,rgba(80,180,255,.18),transparent 35%),
    linear-gradient(#07111e,#02050a);
  color:white;
}

.logo{
  font-size:clamp(38px,8vw,82px);
  font-weight:1000;
  letter-spacing:5px;
  text-shadow:0 5px 25px rgba(0,0,0,.8);
}

.sub{
  margin-top:8px;
  opacity:.65;
  letter-spacing:4px;
  font-size:13px;
}

#startBtn{
  margin-top:42px;
  padding:17px 55px;
  border:0;
  border-radius:18px;
  color:white;
  background:linear-gradient(135deg,#ff5b00,#ff1e00);
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
  box-shadow:0 12px 35px rgba(255,60,0,.35);
  cursor:pointer;
}

#startBtn:active{
  transform:scale(.95);
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:19;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
  color:white;
}

#gameOver h1{
  font-size:clamp(42px,9vw,85px);
  font-weight:1000;
  letter-spacing:5px;
}

#reason{
  margin-top:10px;
  opacity:.8;
  font-size:15px;
  letter-spacing:2px;
}

#restart{
  margin-top:28px;
  padding:15px 42px;
  border:0;
  border-radius:15px;
  background:white;
  color:#111;
  font-weight:900;
  font-size:16px;
}

#controls{
  position:fixed;
  z-index:10;
  left:0;
  right:0;
  bottom:18px;
  display:flex;
  justify-content:space-between;
  padding:0 25px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:13px;
  pointer-events:auto;
}

.control{
  width:68px;
  height:68px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 7px 25px rgba(0,0,0,.3);
}

.control:active{
  transform:scale(.9);
  background:rgba(255,255,255,.2);
}

@media(min-width:800px){
  #controls{
    opacity:.65;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="startScreen">
  <div class="logo">ACP AAYA</div>
  <div class="sub">HILL DRIVE • EXTREME EDITION</div>
  <button id="startBtn">START DRIVE</button>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <div id="reason">CRASHED</div>
  <button id="restart">RESTART</button>
</div>

<div id="controls">
  <div class="controlGroup">
    <div class="control" id="brake">◀</div>
  </div>

  <div class="controlGroup">
    <div class="control" id="boost">⚡</div>
    <div class="control" id="gas">▶</div>
  </div>
</div>

<audio id="startAudio" src="start.mp3" preload="auto"></audio>
<audio id="musicAudio" src="music.m4a" preload="auto"></audio>
<audio id="skillAudio" src="skill.mp3" preload="auto"></audio>
<audio id="outAudio" src="out.mp3" preload="auto"></audio>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* ================= AUDIO ================= */

const startAudio=document.getElementById("startAudio");
const musicAudio=document.getElementById("musicAudio");
const skillAudio=document.getElementById("skillAudio");
const outAudio=document.getElementById("outAudio");

let audioToken=0;

function stopAllAudio(){
  [startAudio,musicAudio,skillAudio,outAudio].forEach(a=>{
    a.pause();
    a.currentTime=0;
  });
}

function beginAudio(){
  audioToken++;
  const token=audioToken;

  stopAllAudio();

  startAudio.currentTime=0;
  startAudio.play().catch(()=>{});

  startAudio.onended=()=>{
    if(token!==audioToken || gameOver) return;

    musicAudio.currentTime=0;
    musicAudio.loop=true;
    musicAudio.play().catch(()=>{});
  };
}

function playSkill(){
  if(gameOver) return;

  skillAudio.currentTime=0;
  skillAudio.play().catch(()=>{});
}

function endAudio(){
  audioToken++;

  startAudio.pause();
  musicAudio.pause();
  skillAudio.pause();

  startAudio.currentTime=0;
  musicAudio.currentTime=0;
  skillAudio.currentTime=0;

  outAudio.currentTime=0;
  outAudio.play().catch(()=>{});
}

/* ================= GAME STATE ================= */

let running=false;
let gameOver=false;
let last=0;

let distance=0;
let coins=0;

let cameraX=0;

let best=Number(localStorage.getItem("acpBest")||0);

const input={
  gas:false,
  brake:false,
  boost:false
};

const car={
  x:180,
  y:300,
  vx:0,
  vy:0,
  angle:0,
  av:0,

  width:125,
  height:48,

  fuel:100,
  boost:100,

  grounded:false,
  wasGrounded:false,
  airTime:0,
  upsideTime:0,

  wheelR:15
};

/* ================= TERRAIN ================= */

let terrain=[];
let lastTerrainX=0;
let seed=7;

function random(){
  seed=(seed*9301+49297)%233280;
  return seed/233280;
}

function terrainY(x){
  if(x<600){
    return H*.72;
  }

  const a=Math.sin(x*.0042)*75;
  const b=Math.sin(x*.0091+1.8)*38;
  const c=Math.sin(x*.017+2)*18;

  return H*.67+a+b+c;
}

function rebuildTerrain(){
  terrain=[];
  const step=35;

  for(let x=-300;x<W+2500;x+=step){
    terrain.push({
      x:x,
      y:terrainY(x)
    });
  }
}

rebuildTerrain();

function groundAt(x){
  return terrainY(x);
}

/* ================= PARTICLES ================= */

const particles=[];

function particle(x,y,type){
  particles.push({
    x,y,
    vx:(Math.random()-.5)*150,
    vy:-Math.random()*180,
    life:.45+Math.random()*.5,
    max:.8,
    type
  });
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];

    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=500*dt;

    if(p.life<=0) particles.splice(i,1);
  }
}

function drawParticles(){
  for(const p of particles){
    const a=Math.max(0,p.life/p.max);

    ctx.globalAlpha=a;

    ctx.beginPath();

    if(p.type==="dust"){
      ctx.arc(p.x-cameraX,p.y,3+Math.random()*3,0,Math.PI*2);
    }else{
      ctx.arc(p.x-cameraX,p.y,2,0,Math.PI*2);
    }

    ctx.fillStyle=p.type==="dust" ? "#c5a77d" : "#fff";
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* ================= COLLECTIBLES ================= */

let fuelCans=[];
let coinItems=[];

function spawnCollectibles(){
  fuelCans=[];
  coinItems=[];

  for(let x=900;x<120000;x+=900+Math.random()*850){
    fuelCans.push({
      x:x,
      y:groundAt(x)-50,
      taken:false
    });
  }

  for(let x=650;x<120000;x+=260+Math.random()*350){
    coinItems.push({
      x:x,
      y:groundAt(x)-45-Math.random()*50,
      taken:false
    });
  }
}

spawnCollectibles();

/* ================= RESET ================= */

function resetGame(){
  running=true;
  gameOver=false;

  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";

  distance=0;
  coins=0;

  seed=7;

  car.x=180;
  car.y=groundAt(car.x)-car.wheelR-28;
  car.vx=0;
  car.vy=0;
  car.angle=0;
  car.av=0;

  car.fuel=100;
  car.boost=100;

  car.grounded=true;
  car.wasGrounded=true;
  car.airTime=0;
  car.upsideTime=0;

  cameraX=0;

  particles.length=0;

  spawnCollectibles();

  beginAudio();

  last=performance.now();
  requestAnimationFrame(loop);
}

function finish(reason){
  if(gameOver) return;

  gameOver=true;
  running=false;

  if(distance>best){
    best=Math.floor(distance);
    localStorage.setItem("acpBest",best);
  }

  document.getElementById("reason").textContent=reason;
  document.getElementById("gameOver").style.display="flex";

  endAudio();
}

/* ================= PHYSICS ================= */

function rotatePoint(px,py,a){
  return {
    x:px*Math.cos(a)-py*Math.sin(a),
    y:px*Math.sin(a)+py*Math.cos(a)
  };
}

function wheelWorld(localX,localY){
  const p=rotatePoint(localX,localY,car.angle);

  return {
    x:car.x+p.x,
    y:car.y+p.y
  };
}

function physics(dt){

  const gravity=1250;

  let throttle=input.gas;
  let brake=input.brake;

  if(car.fuel<=0){
    throttle=false;
  }

  let acceleration=0;

  if(throttle){
    acceleration=520;
  }

  if(brake){
    acceleration=-400;
  }

  /* BOOST */

  if(input.boost && car.boost>0 && car.fuel>0){
    acceleration+=900;
    car.boost-=34*dt;
  }else{
    car.boost+=7*dt;
  }

  car.boost=Math.max(0,Math.min(100,car.boost));

  /* FUEL DRAIN */

  if(throttle){
    car.fuel-=5.2*dt;
  }else{
    car.fuel-=1.15*dt;
  }

  car.fuel=Math.max(0,car.fuel);

  if(car.fuel<=0 && car.vx<40){
    finish("OUT OF FUEL");
    return;
  }

  /* AIR / GROUND */

  const rear=wheelWorld(-43,20);
  const front=wheelWorld(43,20);

  const rearGround=groundAt(rear.x);
  const frontGround=groundAt(front.x);

  const rearPen=rear.y+car.wheelR-rearGround;
  const frontPen=front.y+car.wheelR-frontGround;

  const onRear=rearPen>=-2;
  const onFront=frontPen>=-2;

  car.grounded=onRear||onFront;

  if(car.grounded){

    const targetAngle=Math.atan2(
      frontGround-rearGround,
      front.x-rear.x
    );

    let diff=targetAngle-car.angle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    car.av+=diff*14*dt;
    car.av*=Math.pow(.035,dt);

    if(car.vy>0){
      if(car.vy>760){
        finish("HARD CRASH");
        return;
      }

      car.vy*=.25;
    }

    const deepest=Math.max(rearPen,frontPen);

    if(deepest>0){
      car.y-=deepest;
    }

    if(car.vx>0){
      car.vx+=acceleration*dt;
    }else{
      car.vx+=acceleration*.65*dt;
    }

    car.vx*=Math.pow(.985,dt*60);

  }else{

    car.vy+=gravity*dt;

    if(input.gas){
      car.av+=0.8*dt;
    }

    if(input.brake){
      car.av-=0.8*dt;
    }

    car.av*=Math.pow(.88,dt*60);

    car.airTime+=dt;
  }

  car.vx=Math.max(-180,Math.min(1150,car.vx));

  car.x+=car.vx*dt;
  car.y+=car.vy*dt;

  car.angle+=car.av*dt;

  while(car.angle>Math.PI)car.angle-=Math.PI*2;
  while(car.angle<-Math.PI)car.angle+=Math.PI*2;

  /* UPSIDE-DOWN CRASH */

  if(!car.grounded && Math.abs(car.angle)>2.25){
    car.upsideTime+=dt;
  }else{
    car.upsideTime=Math.max(0,car.upsideTime-dt*2);
  }

  if(car.upsideTime>.65){
    finish("CRASHED");
    return;
  }

  /* FALL */

  if(car.y>H+350){
    finish("FELL OFF");
    return;
  }

  /* SPEED LIMIT / DISTANCE */

  distance=Math.max(distance,(car.x-180)/10);

  /* DUST */

  if(car.grounded && Math.abs(car.vx)>250 && Math.random()<.35){
    const w=wheelWorld(-43,20);
    particle(w.x,w.y+8,"dust");
  }

  /* LANDING PARTICLES */

  if(car.grounded && !car.wasGrounded){
    for(let i=0;i<8;i++){
      const w=wheelWorld((Math.random()-.5)*70,25);
      particle(w.x,w.y,"dust");
    }
  }

  car.wasGrounded=car.grounded;

  /* CAMERA */

  const targetCamera=car.x-W*.37;

  cameraX+=(targetCamera-cameraX)*Math.min(1,dt*5);

  if(cameraX<0)cameraX=0;

  /* COLLECT FUEL */

  for(const f of fuelCans){

    if(f.taken)continue;

    const dx=car.x-f.x;
    const dy=car.y-f.y;

    if(Math.hypot(dx,dy)<75){
      f.taken=true;
      car.fuel=Math.min(100,car.fuel+35);

      for(let i=0;i<14;i++){
        particle(f.x,f.y,"spark");
      }
    }
  }

  /* COINS */

  for(const c of coinItems){

    if(c.taken)continue;

    if(Math.hypot(car.x-c.x,car.y-c.y)<65){
      c.taken=true;
      coins++;

      for(let i=0;i<6;i++){
        particle(c.x,c.y,"spark");
      }
    }
  }
}

/* ================= DRAW WORLD ================= */

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#62c8ff");
  g.addColorStop(.55,"#bcecff");
  g.addColorStop(1,"#f6dfb0");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawMountains(){
  function mountain(offset,amp,color){
    ctx.beginPath();
    ctx.moveTo(0,H*.66);

    for(let x=-100;x<W+150;x+=40){
      const wx=x+cameraX*.15+offset;

      const y=H*.59+
        Math.sin(wx*.002)*amp+
        Math.sin(wx*.005)*amp*.35;

      ctx.lineTo(x,y);
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();

    ctx.fillStyle=color;
    ctx.fill();
  }

  mountain(0,45,"#6a9f9c");
  mountain(500,70,"#4c817f");
  mountain(1000,55,"#396968");
}

function drawSun(){
  const x=W*.78;
  const y=H*.18;

  const grd=ctx.createRadialGradient(x,y,5,x,y,100);
  grd.addColorStop(0,"rgba(255,240,150,.9)");
  grd.addColorStop(1,"rgba(255,240,150,0)");

  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.arc(x,y,100,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffe99b";
  ctx.beginPath();
  ctx.arc(x,y,38,0,Math.PI*2);
  ctx.fill();
}

function drawTerrain(){

  ctx.beginPath();

  ctx.moveTo(-50,H+100);

  for(let x=cameraX-100;x<cameraX+W+150;x+=25){
    ctx.lineTo(x-cameraX,groundAt(x));
  }

  ctx.lineTo(W+100,H+100);
  ctx.closePath();

  const g=ctx.createLinearGradient(0,H*.5,0,H);

  g.addColorStop(0,"#69502f");
  g.addColorStop(.25,"#503b27");
  g.addColorStop(1,"#251d16");

  ctx.fillStyle=g;
  ctx.fill();

  /* grass */

  ctx.beginPath();

  for(let x=cameraX-100;x<cameraX+W+150;x+=20){
    const y=groundAt(x);

    if(x===cameraX-100)
      ctx.moveTo(x-cameraX,y);
    else
      ctx.lineTo(x-cameraX,y);
  }

  ctx.strokeStyle="#65a83d";
  ctx.lineWidth=10;
  ctx.stroke();

  ctx.strokeStyle="#b0d85c";
  ctx.lineWidth=3;
  ctx.stroke();
}

function drawTrees(){

  const start=Math.floor(cameraX/280)*280;

  for(let x=start;x<cameraX+W+500;x+=280){

    if(x<650)continue;

    const y=groundAt(x);

    const sx=x-cameraX;

    ctx.fillStyle="#553722";
    ctx.fillRect(sx-7,y-85,14,85);

    ctx.fillStyle="#2d6934";

    ctx.beginPath();
    ctx.arc(sx,y-105,35,0,Math.PI*2);
    ctx.arc(sx-25,y-82,25,0,Math.PI*2);
    ctx.arc(sx+25,y-82,25,0,Math.PI*2);
    ctx.fill();
  }
}

/* ================= COLLECTIBLES DRAW ================= */

function drawFuel(){
  for(const f of fuelCans){

    if(f.taken)continue;

    const sx=f.x-cameraX;
    const sy=f.y;

    if(sx<-80||sx>W+80)continue;

    ctx.save();
    ctx.translate(sx,sy);

    ctx.shadowBlur=18;
    ctx.shadowColor="rgba(255,70,0,.8)";

    ctx.fillStyle="#e53918";
    ctx.fillRect(-16,-22,32,38);

    ctx.fillStyle="#111";
    ctx.fillRect(-9,-29,18,8);

    ctx.fillStyle="white";
    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.fillText("F",0,2);

    ctx.restore();
  }
}

function drawCoins(){
  for(const c of coinItems){

    if(c.taken)continue;

    const sx=c.x-cameraX;

    if(sx<-50||sx>W+50)continue;

    ctx.save();
    ctx.translate(sx,c.y);

    ctx.rotate(performance.now()*.003);

    ctx.fillStyle="#ffd43b";
    ctx.strokeStyle="#fff1a8";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(0,0,12,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#9b6900";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";
    ctx.fillText("$",0,5);

    ctx.restore();
  }
}

/* ================= CAR ================= */

function drawCar(){

  const sx=car.x-cameraX;
  const sy=car.y;

  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(car.angle);

  /* shadow */

  ctx.save();
  ctx.globalAlpha=.2;
  ctx.fillStyle="#000";
  ctx.beginPath();
  ctx.ellipse(0,39,65,9,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* suspension */

  ctx.strokeStyle="#171717";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(-43,20);
  ctx.lineTo(-43,30);
  ctx.moveTo(43,20);
  ctx.lineTo(43,30);
  ctx.stroke();

  /* body */

  ctx.fillStyle="#15191d";
  ctx.strokeStyle="#080909";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.moveTo(-67,17);
  ctx.lineTo(-60,-10);
  ctx.quadraticCurveTo(-54,-29,-30,-31);
  ctx.lineTo(22,-31);
  ctx.quadraticCurveTo(45,-29,56,-9);
  ctx.lineTo(68,9);
  ctx.lineTo(62,23);
  ctx.lineTo(-60,23);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  /* body highlight */

  const bodyGrad=ctx.createLinearGradient(0,-30,0,22);
  bodyGrad.addColorStop(0,"#ff6336");
  bodyGrad.addColorStop(.45,"#d52e16");
  bodyGrad.addColorStop(1,"#75150d");

  ctx.fillStyle=bodyGrad;

  ctx.beginPath();
  ctx.moveTo(-61,9);
  ctx.lineTo(-53,-12);
  ctx.quadraticCurveTo(-48,-25,-27,-27);
  ctx.lineTo(20,-27);
  ctx.quadraticCurveTo(41,-24,51,-7);
  ctx.lineTo(61,8);
  ctx.lineTo(55,16);
  ctx.lineTo(-54,16);
  ctx.closePath();
  ctx.fill();

  /* windows */

  ctx.fillStyle="#8dd9ef";
  ctx.strokeStyle="#17262c";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-40,-22);
  ctx.lineTo(-15,-25);
  ctx.lineTo(-13,-7);
  ctx.lineTo(-43,-7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-8,-25);
  ctx.lineTo(19,-22);
  ctx.lineTo(37,-7);
  ctx.lineTo(-7,-7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  /* driver */

  ctx.fillStyle="#f0b08c";
  ctx.beginPath();
  ctx.arc(4,-17,9,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#202020";
  ctx.beginPath();
  ctx.arc(4,-20,9,Math.PI,Math.PI*2);
  ctx.fill();

  /* body of driver */

  ctx.fillStyle="#e9e9e9";
  ctx.beginPath();
  ctx.roundRect(-6,-8,20,18,5);
  ctx.fill();

  /* arm */

  ctx.strokeStyle="#eab092";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(7,-3);
  ctx.lineTo(22,5);
  ctx.lineTo(27,0);
  ctx.stroke();

  /* bumper */

  ctx.fillStyle="#171717";
  ctx.fillRect(-70,13,10,11);
  ctx.fillRect(61,13,10,11);

  /* headlights */

  ctx.fillStyle="#fff4a3";
  ctx.shadowBlur=14;
  ctx.shadowColor="#fff1a0";

  ctx.beginPath();
  ctx.ellipse(57,4,5,4,0,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  /* wheels */

  drawWheel(-43,25);
  drawWheel(43,25);

  ctx.restore();
}

function drawWheel(x,y){

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#101010";
  ctx.beginPath();
  ctx.arc(0,0,17,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#454545";
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#aaa";
  ctx.beginPath();
  ctx.arc(0,0,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ================= HUD ================= */

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

function drawHUD(){

  ctx.fillStyle="rgba(0,0,0,.35)";
  roundedRect(16,15,205,98,18);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="bold 14px Arial";
  ctx.fillText("DISTANCE",30,39);

  ctx.font="bold 25px Arial";
  ctx.fillText(Math.floor(distance)+" m",30,67);

  ctx.font="bold 13px Arial";
  ctx.fillText("COINS  "+coins,30,91);

  /* fuel */

  ctx.fillStyle="rgba(0,0,0,.4)";
  roundedRect(W-230,18,210,25,12);
  ctx.fill();

  ctx.fillStyle=car.fuel<25 ? "#ff392f" : "#5bd15b";
  roundedRect(W-225,23,200*(car.fuel/100),15,7);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="bold 11px Arial";
  ctx.fillText("FUEL",W-220,18);

  /* boost */

  ctx.fillStyle="rgba(0,0,0,.4)";
  roundedRect(W-230,56,210,25,12);
  ctx.fill();

  ctx.fillStyle="#f6c844";
  roundedRect(W-225,61,200*(car.boost/100),15,7);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="bold 11px Arial";
  ctx.fillText("BOOST",W-220,55);

  /* best */

  ctx.fillStyle="rgba(0,0,0,.35)";
  roundedRect(W-150,94,130,34,12);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.fillText("BEST  "+best+" m",W-85,116);
  ctx.textAlign="left";
}

/* ================= MAIN DRAW ================= */

function draw(){

  drawSky();
  drawSun();
  drawMountains();
  drawTrees();
  drawTerrain();
  drawFuel();
  drawCoins();
  drawParticles();
  drawCar();
  drawHUD();

  /* speed lines */

  if(car.vx>650){

    ctx.globalAlpha=Math.min(.3,(car.vx-650)/1000);

    for(let i=0;i<9;i++){

      const y=Math.random()*H*.55+H*.2;
      const len=30+Math.random()*80;

      ctx.strokeStyle="white";
      ctx.lineWidth=2;

      ctx.beginPath();
      ctx.moveTo(Math.random()*W,y);
      ctx.lineTo(Math.random()*W+len,y);
      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }
}

/* ================= LOOP ================= */

function loop(t){

  if(!running)return;

  const dt=Math.min(.033,(t-last)/1000);
  last=t;

  physics(dt);

  if(gameOver)return;

  updateParticles(dt);
  draw();

  requestAnimationFrame(loop);
}

/* ================= INPUT ================= */

addEventListener("keydown",e=>{

  if(e.code==="ArrowRight" || e.code==="KeyD"){
    input.gas=true;
  }

  if(e.code==="ArrowLeft" || e.code==="KeyA"){
    input.brake=true;
  }

  if(e.code==="Space" || e.code==="KeyW"){
    if(!input.boost){
      playSkill();
    }
    input.boost=true;
  }
});

addEventListener("keyup",e=>{

  if(e.code==="ArrowRight" || e.code==="KeyD"){
    input.gas=false;
  }

  if(e.code==="ArrowLeft" || e.code==="KeyA"){
    input.brake=false;
  }

  if(e.code==="Space" || e.code==="KeyW"){
    input.boost=false;
  }
});

/* touch controls */

function holdButton(id,key){

  const el=document.getElementById(id);

  const down=e=>{
    e.preventDefault();

    if(key==="boost" && !input.boost){
      playSkill();
    }

    input[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    input[key]=false;
  };

  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
}

holdButton("gas","gas");
holdButton("brake","brake");
holdButton("boost","boost");

/* ================= BUTTONS ================= */

document.getElementById("startBtn").addEventListener("click",()=>{
  resetGame();
});

document.getElementById("restart").addEventListener("click",()=>{
  resetGame();
});

/* initial preview */

draw();
</script>
