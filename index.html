<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ACP AAYA — Extreme Hill Drive</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080c;
  font-family:Arial,sans-serif;
}

canvas{
  width:100vw;
  height:100vh;
  display:block;
  touch-action:none;
}

#start,#over{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,80,20,.16),transparent 35%),
    linear-gradient(145deg,#07101b,#020407);
}

#over{
  display:none;
}

.title{
  font-size:clamp(42px,9vw,88px);
  font-weight:1000;
  letter-spacing:6px;
  text-shadow:0 8px 30px #000;
}

.small{
  opacity:.55;
  letter-spacing:5px;
  margin-top:8px;
}

.main{
  margin-top:40px;
  padding:17px 48px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#ff6a00,#ed1c24);
  color:white;
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  box-shadow:0 12px 40px rgba(255,60,0,.35);
}

.main:active{
  transform:scale(.95);
}

#controls{
  position:fixed;
  z-index:20;
  bottom:18px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  pointer-events:none;
}

.side{
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.ctrl{
  width:76px;
  height:76px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  background:rgba(0,0,0,.42);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(12px);
  box-shadow:0 8px 25px rgba(0,0,0,.35);
  font-weight:1000;
  font-size:25px;
  touch-action:none;
}

.ctrl span{
  font-size:9px;
  margin-top:3px;
  letter-spacing:1px;
}

.ctrl:active{
  transform:scale(.88);
  background:rgba(255,255,255,.22);
}

.boost{
  width:84px;
  height:84px;
  background:rgba(255,75,0,.35);
}

@media(min-width:900px){
  #controls{
    opacity:.6;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="start">
  <div class="title">ACP AAYA</div>
  <div class="small">EXTREME HILL DRIVE</div>
  <button class="main" id="startBtn">START DRIVE</button>
</div>

<div id="over">
  <div class="title">CRASH!</div>
  <div class="small" id="reason">CAR FLIPPED</div>
  <button class="main" id="restart">RESTART</button>
</div>

<div id="controls">

  <div class="side">
    <div class="ctrl" id="back">
      ◀
      <span>BACK</span>
    </div>
  </div>

  <div class="side">
    <div class="ctrl boost" id="boost">
      ⚡
      <span>BOOST</span>
    </div>

    <div class="ctrl" id="forward">
      ▶
      <span>FORWARD</span>
    </div>
  </div>

</div>

<!-- AUDIO -->
<audio id="startAudio" src="start.mp3" preload="auto"></audio>
<audio id="musicAudio" src="music.mp3" preload="auto"></audio>
<audio id="skillAudio" src="skill.mp3" preload="auto"></audio>
<audio id="outAudio" src="out.mp3" preload="auto"></audio>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(
    devicePixelRatio||1,
    2
  );

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

addEventListener("resize",resize);
resize();


/* =====================================================
   AUDIO MANAGER
===================================================== */

const startAudio=
  document.getElementById("startAudio");

const musicAudio=
  document.getElementById("musicAudio");

const skillAudio=
  document.getElementById("skillAudio");

const outAudio=
  document.getElementById("outAudio");

let audioVersion=0;

function stopMainAudio(){

  startAudio.pause();
  musicAudio.pause();
  skillAudio.pause();

  startAudio.currentTime=0;
  musicAudio.currentTime=0;
  skillAudio.currentTime=0;
}

function startGameAudio(){

  audioVersion++;

  const version=audioVersion;

  stopMainAudio();

  /*
    EXACT SEQUENCE:

    start.mp3
       ↓
    finish
       ↓
    music.mp3 LOOP
  */

  startAudio.currentTime=0;

  startAudio.play().catch(()=>{});

  startAudio.onended=()=>{

    if(version!==audioVersion)return;
    if(gameOver)return;

    musicAudio.loop=true;
    musicAudio.currentTime=0;

    musicAudio.play().catch(()=>{});
  };
}

function playBoostAudio(){

  if(gameOver)return;

  skillAudio.currentTime=0;

  skillAudio.play().catch(()=>{});
}

function playOutAudio(){

  audioVersion++;

  startAudio.pause();
  musicAudio.pause();
  skillAudio.pause();

  startAudio.currentTime=0;
  musicAudio.currentTime=0;
  skillAudio.currentTime=0;

  outAudio.currentTime=0;

  outAudio.play().catch(()=>{});
}


/* =====================================================
   INPUT
===================================================== */

const input={
  forward:false,
  back:false,
  boost:false
};


/* =====================================================
   GAME VARIABLES
===================================================== */

let running=false;
let gameOver=false;
let last=0;

let cameraX=0;

let distance=0;
let coins=0;

let best=
  Number(
    localStorage.getItem("ACP_BEST")||0
  );


/* =====================================================
   CAR
===================================================== */

const car={

  x:180,
  y:300,

  vx:0,
  vy:0,

  angle:0,
  av:0,

  fuel:100,
  boost:100,

  wheelR:16,

  grounded:false,

  upsideTimer:0
};


/* =====================================================
   TERRAIN
===================================================== */

let terrainSeed=17;

function groundY(x){

  if(x<620){
    return H*.72;
  }

  return H*.67
    +Math.sin(x*.0035)*78
    +Math.sin(x*.0075+1.2)*39
    +Math.sin(x*.014+2.5)*18
    +Math.sin(x*.025)*7;
}


/* =====================================================
   PARTICLES
===================================================== */

const particles=[];

function addParticle(x,y,type){

  particles.push({

    x:x,
    y:y,

    vx:(Math.random()-.5)*220,

    vy:
      -50-
      Math.random()*190,

    life:
      .45+
      Math.random()*.55,

    type:type
  });
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.life-=dt;

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=550*dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life);

    ctx.beginPath();

    const size=
      p.type==="dust"
      ? 3+Math.random()*5
      : 2+Math.random()*3;

    ctx.arc(
      p.x-cameraX,
      p.y,
      size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      p.type==="dust"
      ? "#b49a79"
      : "#ffd84a";

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* =====================================================
   ITEMS
===================================================== */

let fuelCans=[];
let coinItems=[];

function spawnItems(){

  fuelCans=[];
  coinItems=[];

  for(
    let x=1000;
    x<100000;
    x+=850+Math.random()*900
  ){

    fuelCans.push({

      x:x,

      y:
        groundY(x)-45,

      taken:false
    });
  }

  for(
    let x=750;
    x<100000;
    x+=220+Math.random()*350
  ){

    coinItems.push({

      x:x,

      y:
        groundY(x)
        -50
        -Math.random()*55,

      taken:false
    });
  }
}

spawnItems();


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  running=true;
  gameOver=false;

  document.getElementById(
    "start"
  ).style.display="none";

  document.getElementById(
    "over"
  ).style.display="none";

  car.x=180;

  car.y=
    groundY(car.x)
    -car.wheelR
    -25;

  car.vx=0;
  car.vy=0;

  car.angle=0;
  car.av=0;

  car.fuel=100;
  car.boost=100;

  car.grounded=true;
  car.upsideTimer=0;

  cameraX=0;

  distance=0;
  coins=0;

  particles.length=0;

  spawnItems();

  startGameAudio();

  last=performance.now();

  requestAnimationFrame(loop);
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(reason){

  if(gameOver)return;

  gameOver=true;
  running=false;

  if(distance>best){

    best=Math.floor(distance);

    localStorage.setItem(
      "ACP_BEST",
      best
    );
  }

  document.getElementById(
    "reason"
  ).textContent=reason;

  document.getElementById(
    "over"
  ).style.display="flex";

  playOutAudio();
}


/* =====================================================
   ROTATION
===================================================== */

function rotatePoint(x,y,a){

  return {

    x:
      x*Math.cos(a)
      -
      y*Math.sin(a),

    y:
      x*Math.sin(a)
      +
      y*Math.cos(a)
  };
}

function worldPoint(x,y){

  const p=
    rotatePoint(
      x,
      y,
      car.angle
    );

  return {

    x:car.x+p.x,
    y:car.y+p.y
  };
}


/* =====================================================
   PHYSICS
===================================================== */

function physics(dt){

  let acceleration=0;

  /* FORWARD */

  if(
    input.forward &&
    car.fuel>0
  ){

    acceleration+=590;
  }

  /* BACK */

  if(input.back){

    acceleration-=390;
  }


  /* BOOST */

  if(
    input.boost &&
    car.boost>0 &&
    car.fuel>0
  ){

    acceleration+=1050;

    car.boost-=38*dt;

    /*
      Air control:
      Forward = rotate forward
    */

    if(!car.grounded && input.forward){

      car.av+=
        1.25*
        dt;
    }

  }else{

    car.boost+=8*dt;
  }

  car.boost=
    Math.max(
      0,
      Math.min(
        100,
        car.boost
      )
    );


  /* FUEL */

  if(
    input.forward &&
    car.fuel>0
  ){

    car.fuel-=5*dt;

  }else{

    car.fuel-=1*dt;
  }

  car.fuel=
    Math.max(
      0,
      car.fuel
    );


  /* WHEELS */

  const rear=
    worldPoint(
      -45,
      21
    );

  const front=
    worldPoint(
      45,
      21
    );

  const rearGround=
    groundY(rear.x);

  const frontGround=
    groundY(front.x);


  const rearContact=
    rear.y+
    car.wheelR
    >=
    rearGround-3;

  const frontContact=
    front.y+
    car.wheelR
    >=
    frontGround-3;

  car.grounded=
    rearContact||
    frontContact;


  /* =================================================
     ON GROUND
  ================================================= */

  if(car.grounded){

    const slope=
      Math.atan2(
        frontGround-rearGround,
        front.x-rear.x
      );

    let difference=
      slope-car.angle;

    while(
      difference>
      Math.PI
    ){
      difference-=Math.PI*2;
    }

    while(
      difference<
      -Math.PI
    ){
      difference+=Math.PI*2;
    }


    /*
      Suspension automatically follows hill.
    */

    car.av+=
      difference*
      17*
      dt;

    car.av*=
      Math.pow(
        .035,
        dt*60
      );


    const penetration=Math.max(

      rear.y+
      car.wheelR-
      rearGround,

      front.y+
      car.wheelR-
      frontGround
    );


    if(penetration>0){

      car.y-=penetration;
    }


    car.vx+=
      acceleration*
      dt;


    car.vx*=
      Math.pow(
        .986,
        dt*60
      );

  }

  /* =================================================
     AIR
  ================================================= */

  else{

    car.vy+=
      1250*dt;


    /*
      Controls rotate car in air.
    */

    if(input.forward){

      car.av+=
        1.25*dt;
    }

    if(input.back){

      car.av-=
        1.25*dt;
    }

    car.av*=
      Math.pow(
        .96,
        dt*60
      );
  }


  /* SPEED */

  car.vx=
    Math.max(
      -220,
      Math.min(
        1250,
        car.vx
      )
    );


  /* POSITION */

  car.x+=
    car.vx*dt;

  car.y+=
    car.vy*dt;

  car.angle+=
    car.av*dt;


  while(
    car.angle>
    Math.PI
  ){
    car.angle-=Math.PI*2;
  }

  while(
    car.angle<
    -Math.PI
  ){
    car.angle+=Math.PI*2;
  }


  /* =================================================
     FLIP DETECTION
     
     ONLY genuinely upside-down = crash
  ================================================= */

  const absAngle=
    Math.abs(car.angle);

  /*
    2.30 radians ≈ 132 degrees.
    Small jumps/tilts won't trigger it.
  */

  if(absAngle>2.30){

    car.upsideTimer+=dt;

  }else{

    car.upsideTimer=
      Math.max(
        0,
        car.upsideTimer-dt*3
      );
  }


  /*
    Must stay upside-down for 0.48 sec.
  */

  if(
    car.upsideTimer>=.48
  ){

    endGame(
      "CAR FLIPPED"
    );

    return;
  }


  /* =================================================
     FUEL EMPTY
  ================================================= */

  if(car.fuel<=0){

    endGame(
      "OUT OF FUEL"
    );

    return;
  }


  /* FALL */

  if(car.y>H+700){

    endGame(
      "CAR LOST"
    );

    return;
  }


  /* DISTANCE */

  distance=
    Math.max(
      distance,
      (car.x-180)/10
    );


  /* DUST */

  if(
    car.grounded &&
    car.vx>260 &&
    Math.random()<.32
  ){

    const p=
      worldPoint(
        -45,
        25
      );

    addParticle(
      p.x,
      p.y,
      "dust"
    );
  }


  /* FUEL PICKUP */

  for(const f of fuelCans){

    if(f.taken)continue;

    if(
      Math.hypot(
        car.x-f.x,
        car.y-f.y
      )<75
    ){

      f.taken=true;

      car.fuel=
        Math.min(
          100,
          car.fuel+35
        );

      for(let i=0;i<15;i++){

        addParticle(
          f.x,
          f.y,
          "spark"
        );
      }
    }
  }


  /* COINS */

  for(const c of coinItems){

    if(c.taken)continue;

    if(
      Math.hypot(
        car.x-c.x,
        car.y-c.y
      )<65
    ){

      c.taken=true;

      coins++;

      for(let i=0;i<7;i++){

        addParticle(
          c.x,
          c.y,
          "spark"
        );
      }
    }
  }


  /* CAMERA */

  const target=
    car.x-W*.38;

  cameraX+=
    (target-cameraX)*
    Math.min(
      1,
      dt*5
    );

  cameraX=
    Math.max(
      0,
      cameraX
    );
}


/* =====================================================
   SKY
===================================================== */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  g.addColorStop(
    0,
    "#389ee5"
  );

  g.addColorStop(
    .55,
    "#a7e1f2"
  );

  g.addColorStop(
    1,
    "#f2d19b"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );
}


/* =====================================================
   SUN
===================================================== */

function drawSun(){

  const x=W*.78;
  const y=H*.17;

  const g=
    ctx.createRadialGradient(
      x,y,5,
      x,y,115
    );

  g.addColorStop(
    0,
    "rgba(255,240,150,.9)"
  );

  g.addColorStop(
    1,
    "rgba(255,240,150,0)"
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    115,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#ffe89a";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    38,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =====================================================
   MOUNTAINS
===================================================== */

function mountainLayer(
  parallax,
  amplitude,
  base,
  light
){

  ctx.beginPath();

  ctx.moveTo(
    0,
    H
  );

  for(
    let sx=-100;
    sx<W+150;
    sx+=35
  ){

    const wx=
      sx+
      cameraX*parallax;

    const y=
      base+
      Math.sin(
        wx*.0028
      )*
      amplitude+
      Math.sin(
        wx*.006
      )*
      amplitude*.35;

    ctx.lineTo(
      sx,
      y
    );
  }

  ctx.lineTo(
    W,
    H
  );

  ctx.closePath();

  ctx.fillStyle=
    `hsl(160,25%,${light}%)`;

  ctx.fill();
}

function drawMountains(){

  mountainLayer(
    .12,
    60,
    H*.57,
    48
  );

  mountainLayer(
    .22,
    75,
    H*.61,
    39
  );

  mountainLayer(
    .35,
    48,
    H*.64,
    31
  );
}


/* =====================================================
   TREES
===================================================== */

function drawTrees(){

  const first=
    Math.floor(
      cameraX/270
    )*270;

  for(
    let x=first;
    x<cameraX+W+400;
    x+=270
  ){

    if(x<700)continue;

    const y=
      groundY(x);

    const sx=
      x-cameraX;

    ctx.fillStyle="#503620";

    ctx.fillRect(
      sx-6,
      y-75,
      12,
      75
    );

    ctx.fillStyle="#285e35";

    ctx.beginPath();

    ctx.arc(
      sx,
      y-98,
      34,
      0,
      Math.PI*2
    );

    ctx.arc(
      sx-24,
      y-82,
      23,
      0,
      Math.PI*2
    );

    ctx.arc(
      sx+24,
      y-82,
      23,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* =====================================================
   TERRAIN
===================================================== */

function drawTerrain(){

  ctx.beginPath();

  ctx.moveTo(
    -100,
    H+100
  );

  for(
    let x=cameraX-100;
    x<cameraX+W+150;
    x+=20
  ){

    ctx.lineTo(
      x-cameraX,
      groundY(x)
    );
  }

  ctx.lineTo(
    W+100,
    H+100
  );

  ctx.closePath();

  const g=
    ctx.createLinearGradient(
      0,H*.55,
      0,H
    );

  g.addColorStop(
    0,
    "#68492d"
  );

  g.addColorStop(
    .4,
    "#493522"
  );

  g.addColorStop(
    1,
    "#211810"
  );

  ctx.fillStyle=g;

  ctx.fill();


  /* grass */

  ctx.beginPath();

  for(
    let x=cameraX-100;
    x<cameraX+W+150;
    x+=15
  ){

    const y=
      groundY(x);

    if(
      x===
      cameraX-100
    ){

      ctx.moveTo(
        x-cameraX,
        y
      );

    }else{

      ctx.lineTo(
        x-cameraX,
        y
      );
    }
  }

  ctx.strokeStyle="#62a83d";
  ctx.lineWidth=11;

  ctx.stroke();

  ctx.strokeStyle="#b4db62";
  ctx.lineWidth=3;

  ctx.stroke();
}


/* =====================================================
   FUEL
===================================================== */

function drawFuel(){

  for(const f of fuelCans){

    if(f.taken)continue;

    const sx=
      f.x-cameraX;

    if(
      sx<-80||
      sx>W+80
    )continue;

    ctx.save();

    ctx.translate(
      sx,
      f.y
    );

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff4b16";

    ctx.fillStyle="#e93819";

    ctx.fillRect(
      -16,
      -22,
      32,
      39
    );

    ctx.fillStyle="#111";

    ctx.fillRect(
      -9,
      -30,
      18,
      9
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";

    ctx.font="bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "F",
      0,
      3
    );

    ctx.restore();
  }
}


/* =====================================================
   COINS
===================================================== */

function drawCoins(){

  for(const c of coinItems){

    if(c.taken)continue;

    const sx=
      c.x-cameraX;

    if(
      sx<-50||
      sx>W+50
    )continue;

    ctx.save();

    ctx.translate(
      sx,
      c.y
    );

    ctx.rotate(
      performance.now()*.004
    );

    ctx.fillStyle="#ffd33d";
    ctx.strokeStyle="#fff3a5";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      13,
      0,
      Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

    ctx.fillStyle="#8b6500";

    ctx.font="bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "$",
      0,
      5
    );

    ctx.restore();
  }
}


/* =====================================================
   WHEEL
===================================================== */

function drawWheel(x,y){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.fillStyle="#0c0d0f";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#555";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#c6c6c6";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =====================================================
   CAR
===================================================== */

function drawCar(){

  const sx=
    car.x-cameraX;

  const sy=
    car.y;

  ctx.save();

  ctx.translate(
    sx,
    sy
  );

  ctx.rotate(
    car.angle
  );


  /* shadow */

  ctx.save();

  ctx.globalAlpha=.22;

  ctx.fillStyle="#000";

  ctx.beginPath();

  ctx.ellipse(
    0,
    42,
    70,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* suspension */

  ctx.strokeStyle="#151515";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    -45,
    17
  );

  ctx.lineTo(
    -45,
    29
  );

  ctx.moveTo(
    45,
    17
  );

  ctx.lineTo(
    45,
    29
  );

  ctx.stroke();


  /* body */

  const body=
    ctx.createLinearGradient(
      0,-35,
      0,25
    );

  body.addColorStop(
    0,
    "#ff7043"
  );

  body.addColorStop(
    .45,
    "#db3218"
  );

  body.addColorStop(
    1,
    "#75150c"
  );

  ctx.fillStyle=body;

  ctx.strokeStyle="#090909";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    -70,
    17
  );

  ctx.lineTo(
    -61,
    -8
  );

  ctx.quadraticCurveTo(
    -54,
    -31,
    -30,
    -33
  );

  ctx.lineTo(
    20,
    -33
  );

  ctx.quadraticCurveTo(
    45,
    -29,
    58,
    -7
  );

  ctx.lineTo(
    70,
    12
  );

  ctx.lineTo(
    62,
    24
  );

  ctx.lineTo(
    -62,
    24
  );

  ctx.closePath();

  ctx.fill();
  ctx.stroke();


  /* windows */

  ctx.fillStyle="#8bd6eb";
  ctx.strokeStyle="#1b3038";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(
    -43,
    -24
  );

  ctx.lineTo(
    -16,
    -28
  );

  ctx.lineTo(
    -13,
    -7
  );

  ctx.lineTo(
    -45,
    -7
  );

  ctx.closePath();

  ctx.fill();
  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    -9,
    -28
  );

  ctx.lineTo(
    19,
    -25
  );

  ctx.lineTo(
    39,
    -7
  );

  ctx.lineTo(
    -8,
    -7
  );

  ctx.closePath();

  ctx.fill();
  ctx.stroke();


  /* DRIVER */

  ctx.fillStyle="#efb08e";

  ctx.beginPath();

  ctx.arc(
    4,
    -17,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  ctx.fillStyle="#202020";

  ctx.beginPath();

  ctx.arc(
    4,
    -20,
    9,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* shirt */

  ctx.fillStyle="#eee";

  ctx.beginPath();

  ctx.roundRect(
    -7,
    -9,
    21,
    19,
    5
  );

  ctx.fill();


  /* arm */

  ctx.strokeStyle="#eab092";
  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    7,
    -3
  );

  ctx.lineTo(
    22,
    5
  );

  ctx.lineTo(
    27,
    0
  );

  ctx.stroke();


  /* bumpers */

  ctx.fillStyle="#151515";

  ctx.fillRect(
    -73,
    13,
    12,
    12
  );

  ctx.fillRect(
    61,
    13,
    12,
    12
  );


  /* light */

  ctx.fillStyle="#fff2a0";

  ctx.shadowBlur=16;
  ctx.shadowColor="#fff1a0";

  ctx.beginPath();

  ctx.ellipse(
    59,
    3,
    6,
    4,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;


  drawWheel(
    -45,
    25
  );

  drawWheel(
    45,
    25
  );


  ctx.restore();
}


/* =====================================================
   HUD
===================================================== */

function box(
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    h,
    r
  );
}

function drawHUD(){

  /* score */

  ctx.fillStyle=
    "rgba(0,0,0,.34)";

  box(
    16,
    15,
    210,
    100,
    18
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.font="bold 13px Arial";

  ctx.fillText(
    "DISTANCE",
    30,
    38
  );

  ctx.font="bold 25px Arial";

  ctx.fillText(
    Math.floor(distance)+" m",
    30,
    67
  );

  ctx.font="bold 13px Arial";

  ctx.fillText(
    "COINS  "+coins,
    30,
    91
  );


  /* fuel */

  ctx.fillStyle=
    "rgba(0,0,0,.45)";

  box(
    W-230,
    20,
    210,
    24,
    12
  );

  ctx.fill();

  ctx.fillStyle=
    car.fuel<25
    ? "#ff3636"
    : "#58d35c";

  box(
    W-225,
    25,
    200*(car.fuel/100),
    14,
    7
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.font="bold 10px Arial";

  ctx.fillText(
    "FUEL",
    W-220,
    18
  );


  /* boost */

  ctx.fillStyle=
    "rgba(0,0,0,.45)";

  box(
    W-230,
    58,
    210,
    24,
    12
  );

  ctx.fill();

  ctx.fillStyle="#f7c93d";

  box(
    W-225,
    63,
    200*(car.boost/100),
    14,
    7
  );

  ctx.fill();

  ctx.fillStyle="#fff";

  ctx.fillText(
    "BOOST",
    W-220,
    56
  );


  /* best */

  ctx.fillStyle=
    "rgba(0,0,0,.34)";

  box(
    W-155,
    96,
    135,
    34,
    12
  );

  ctx.fill();

  ctx.textAlign="center";

  ctx.font="bold 12px Arial";

  ctx.fillStyle="#fff";

  ctx.fillText(
    "BEST "+best+" m",
    W-87,
    118
  );

  ctx.textAlign="left";
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  drawSky();

  drawSun();

  drawMountains();

  drawTrees();

  drawTerrain();

  drawFuel();

  drawCoins();

  drawParticles();

  drawCar();

  drawHUD();


  /* SPEED EFFECT */

  if(car.vx>700){

    ctx.globalAlpha=
      Math.min(
        .32,
        (car.vx-700)/1100
      );

    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;

    for(
      let i=0;
      i<10;
      i++
    ){

      const y=
        H*.2+
        Math.random()*H*.55;

      const x=
        Math.random()*W;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        x+40+Math.random()*100,
        y
      );

      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }
}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running)return;

  const dt=
    Math.min(
      .033,
      (time-last)/1000
    );

  last=time;

  physics(dt);

  if(gameOver)return;

  updateParticles(dt);

  draw();

  requestAnimationFrame(loop);
}


/* =====================================================
   KEYBOARD
===================================================== */

addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="ArrowRight"||
      e.code==="KeyD"
    ){

      input.forward=true;
    }


    if(
      e.code==="ArrowLeft"||
      e.code==="KeyA"
    ){

      input.back=true;
    }


    if(
      e.code==="Space"||
      e.code==="KeyW"
    ){

      if(!input.boost){

        boostSound();
      }

      input.boost=true;

      e.preventDefault();
    }
  }
);


addEventListener(
  "keyup",
  e=>{

    if(
      e.code==="ArrowRight"||
      e.code==="KeyD"
    ){

      input.forward=false;
    }


    if(
      e.code==="ArrowLeft"||
      e.code==="KeyA"
    ){

      input.back=false;
    }


    if(
      e.code==="Space"||
      e.code==="KeyW"
    ){

      input.boost=false;
    }
  }
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

function holdButton(
  id,
  key
){

  const el=
    document.getElementById(id);


  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      if(
        key==="boost" &&
        !input.boost
      ){

        boostSound();
      }

      input[key]=true;
    }
  );


  function release(e){

    e.preventDefault();

    input[key]=false;
  }


  el.addEventListener(
    "pointerup",
    release
  );

  el.addEventListener(
    "pointercancel",
    release
  );

  el.addEventListener(
    "pointerleave",
    release
  );
}

holdButton(
  "forward",
  "forward"
);

holdButton(
  "back",
  "back"
);

holdButton(
  "boost",
  "boost"
);


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    resetGame
  );

document
  .getElementById("restart")
  .addEventListener(
    "click",
    resetGame
  );


/* INITIAL */
draw();

</script>
